{% load static %}
{% load extra_settings %}

<header id="header" class="header header-sticky z-index-5 header-sticky-smart disable-transition-all {{ positionclass|default:'' }} start-0 end-0">
    <div class="sticky-area">
        <div class="main-header nav navbar navbar-light navbar-expand-xl py-6 py-xl-0">
            <div class="container-wide container flex-nowrap">

                <div class="w-72px d-flex d-xl-none">
                    <button class="navbar-toggler align-self-center  border-0 shadow-none px-0 canvas-toggle p-4"
                        type="button" data-bs-toggle="offcanvas" data-bs-target="#offCanvasNavBar"
                        aria-controls="offCanvasNavBar" aria-expanded="false" aria-label="Toggle Navigation">
                        <span class="fs-24 toggle-icon"></span>
                    </button>
                </div>

                <a href="/" class="navbar-brand has-sticky-logo py-0 mx-auto w-xl-50">
                    <img class="light-mode-img" src="{% get_media_prefix %}{% get_setting 'LOGO' %}" width="80" height="80" alt="{% get_setting 'WEBSITE_NAME' %}">
                    <img class="sticky-logo sticky-logo-light" src="{% get_media_prefix %}{% get_setting 'LOGO' %}" width="80" height="80" alt="{% get_setting 'WEBSITE_NAME' %}">
                </a>

                <div class="d-none d-xl-flex w-xl-50 justify-content-center">
                    <ul class="navbar-nav">
                        <li class="nav-item transition-all-xl-1 py-xl-11 py-0 mx-xxl-8 mx-xl-6">
                            <a class="nav-link d-flex justify-content-between position-relative py-xl-0 px-xl-0 text-uppercase fw-semibold ls-1 fs-15px fs-xl-14px" href="/" id="menu-item-home" aria-expanded="false">
                                Home
                            </a>
                        </li>
                        <li class="nav-item transition-all-xl-1 py-xl-11 py-0 mx-xxl-8 mx-xl-6">
                            <a class="nav-link d-flex justify-content-between position-relative py-xl-0 px-xl-0 text-uppercase fw-semibold ls-1 fs-15px fs-xl-14px" href="{% url 'products:shop' %}" id="menu-item-shop" aria-expanded="false">
                                Shop
                            </a>
                        </li>
                        <li class="nav-item transition-all-xl-1 py-xl-11 py-0 mx-xxl-8 mx-xl-6">
                            <a class="nav-link d-flex justify-content-between position-relative py-xl-0 px-xl-0 text-uppercase fw-semibold ls-1 fs-15px fs-xl-14px" href="{% url 'carts:cart_view' %}" id="menu-item-shop" aria-expanded="false">
                                Cart
                            </a>
                        </li>
                    </ul>
                </div>

                <div class="icons-actions d-flex justify-content-end w-xl-50 fs-28px text-body-emphasis">
                    <div class="px-xl-5 d-inline-block">
                        <a class="lh-1 color-inherit text-decoration-none" href="#" data-bs-toggle="offcanvas"
                            data-bs-target="#searchModal" aria-controls="searchModal" aria-expanded="false">
                            <svg class="icon icon-magnifying-glass-light">
                                <use xlink:href="#icon-magnifying-glass-light"></use>
                            </svg>
                        </a>
                    </div>
                    <div class="px-5 d-none d-xl-inline-block">
                        <a class="lh-1 color-inherit text-decoration-none" href="#" data-bs-toggle="modal"
                            data-bs-target="#signInModal">
                            <svg class="icon icon-user-light">
                                <use xlink:href="#icon-user-light"></use>
                            </svg>
                        </a>
                    </div>
                    {% if cart_items|length > 0 %}
                    <div class="px-5 d-none d-xl-inline-block">
                        <a class="position-relative lh-1 color-inherit text-decoration-none" href="#" data-bs-toggle="offcanvas" data-bs-target="#shoppingCart" aria-controls="shoppingCart" aria-expanded="false">
                            <svg class="icon icon-star-light">
                                <use xlink:href="#icon-shopping-bag-open-light"></use>
                            </svg>
                            <span class="badge bg-dark text-white position-absolute top-0 start-100 translate-middle mt-4 rounded-circle fs-13px p-0 square" style="--square-size: 18px">
                                {{ cart_items|length }}
                            </span>
                        </a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</header>
